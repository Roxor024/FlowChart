name: FlowPilot v0.3 validation
on:
  push:
    branches: [main, flowpilot-v0.3]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_blueprint.py examples/order-processing/integration-blueprint.json
      - run: python tools/render_report.py examples/order-processing/integration-blueprint.json output/example-report.html
      - name: Package Claude Desktop Skill
        run: |
          cd .claude/skills
          zip -r ../../flowpilot-architect-v0.3.zip flowpilot-architect
      - uses: actions/upload-artifact@v4
        with:
          name: FlowPilot-v0.3-Claude-Desktop-and-HTML-report
          path: |
            flowpilot-architect-v0.3.zip
            output/example-report.html
